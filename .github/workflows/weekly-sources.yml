name: Weekly source check

on:
  schedule:
    - cron: '0 1 * * 1'   # 每周一 09:00 北京时间
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check sources
        run: python check_sources.py && python build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 每周音源检测 $(date -u +%F)" || echo "nothing to commit"
          git push
      - name: Rebuild Passion Music TV when sources changed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat .sources_changed 2>/dev/null)" = "1" ]; then
            gh workflow run build.yml --ref passion-music-tv -R ${{ github.repository }}
          fi
