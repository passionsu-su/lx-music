name: Build Passion Music TV

on:
  push:
    branches: [passion-music-tv]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK platform
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          echo "using $SDKM"
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-37" || ($SDKM --list | grep -E "platforms;android-3" ; true)
      - uses: gradle/actions/setup-gradle@v4
      - name: Bundle latest sources
        run: python3 scripts/fetch_builtin_sources.py
      - name: Build release APK
        run: |
          chmod +x gradlew
          VER="3.0.${GITHUB_RUN_NUMBER}"
          mkdir -p out
          for ABI in arm64-v8a armeabi-v7a; do
            rm -rf app/build/outputs/apk/release
            ./gradlew :app:assembleRelease -PtargetAbi=$ABI --no-daemon --stacktrace
            cp app/build/outputs/apk/release/*.apk out/PassionMusic-TV-v${VER}-${ABI}.apk
          done
      - name: Collect APK
        id: apk
        run: |
          VER="3.0.${GITHUB_RUN_NUMBER}"
          echo "ver=$VER" >> $GITHUB_OUTPUT
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: PassionMusic-TV
          path: out/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: passion-music-tv-v${{ steps.apk.outputs.ver }}
          name: Passion Music TV v${{ steps.apk.outputs.ver }}
          target_commitish: ${{ github.sha }}
          body: |
            Passion Music —— Android TV 音乐播放器（基于 bmizhou/lx-music-tv，Apache-2.0）
            - 包名：com.passion.music.tv（可与原版 LX Music TV 共存）
            - 架构：arm64-v8a（绝大多数电视/盒子）
            - arm64-v8a：绝大多数 64 位电视/盒子；armeabi-v7a：老款 32 位电视/盒子（如部分小米、当贝、海信旧机型）
            - 内置最新音源（首次启动自动导入并启用），设置 → 播放源管理 开启 HTTP 服务器后手机扫码可一键导入推荐音源
            - 安装：U 盘或局域网传到电视，用文件管理器安装；首次需允许"未知来源"
          files: out/*.apk
