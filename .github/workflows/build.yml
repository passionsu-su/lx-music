name: Build Passion Music TV

on:
  push:
    branches: [passion-music-tv]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-37" || sdkmanager --list | grep platforms | tail -5
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Collect APK
        id: apk
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/PassionMusic-TV-v${VER}-arm64-v8a.apk
          echo "ver=$VER" >> $GITHUB_OUTPUT
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: PassionMusic-TV
          path: out/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: passion-music-tv-v${{ steps.apk.outputs.ver }}
          name: Passion Music TV v${{ steps.apk.outputs.ver }}
          target_commitish: ${{ github.sha }}
          body: |
            Passion Music —— Android TV 音乐播放器（基于 bmizhou/lx-music-tv，Apache-2.0）
            - 包名：com.passion.music.tv（可与原版 LX Music TV 共存）
            - 架构：arm64-v8a（绝大多数电视/盒子）
            - 安装：U 盘或局域网传到电视，用文件管理器安装；首次需允许"未知来源"
          files: out/*.apk
